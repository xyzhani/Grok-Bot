<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Degen Bot's</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#05070f}
.cc{background:radial-gradient(1200px 600px at 10% -10%,#12234a 0%,#070b17 55%,#05070f 100%);color:#e6edf7;font-family:Inter,system-ui,-apple-system,sans-serif;padding:28px;min-height:100vh}
.cc h1{font-size:30px;margin:0;letter-spacing:.5px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.cc h3{font-size:20px;margin:30px 0 12px;color:#e6edf7;letter-spacing:.4px}
.sub{color:#8b9bb4;font-size:14px;margin:6px 0 22px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.15);border-radius:16px;padding:16px;backdrop-filter:blur(6px);animation:rise .6s ease both;transition:transform .25s}
.card:hover{transform:translateY(-3px)}
.glow{position:absolute;inset:-1px;border-radius:16px;pointer-events:none;animation:glow 3.2s ease-in-out infinite}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;letter-spacing:.6px}
.ptag{font-size:10px;padding:1px 7px;border-radius:999px;background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid #fbbf2488;margin-left:6px;letter-spacing:.6px;font-weight:600}
.rtag{background:rgba(52,211,153,.15);color:#34d399;border-color:#34d39988}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}
.live{background:#34d399;animation:pulse 1.6s infinite}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;font-size:13px;color:#8b9bb4;margin-top:4px}.kv b{color:#e6edf7;font-weight:600}
.bar{height:6px;border-radius:4px;background:rgba(248,113,113,.35);overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:#34d399;transition:width 1.2s ease;width:0}
.panel{margin-top:22px;background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.15);border-radius:16px;padding:18px;animation:rise .7s ease both}
.panel h2{font-size:17px;margin:0 0 4px}
details.sec{margin-top:12px;background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.14);border-radius:14px;padding:4px 16px}
details.sec>summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'\25B8';transition:transform .2s;color:#8b9bb4}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.inner{margin:8px 0 14px}details.inner>summary{cursor:pointer;color:#8b9bb4;font-size:14px;padding:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{color:#8b9bb4;font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid rgba(148,163,184,.2);position:sticky;top:0;background:#0b1224}
.tbl td{padding:6px 8px;border-bottom:1px solid rgba(148,163,184,.08)}.tbl tr:hover td{background:rgba(34,211,238,.05)}
.scroll{max-height:420px;overflow:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#8b9bb4;margin:8px 0}
.line{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 2.2s ease forwards}
.addr{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;color:#22d3ee}
a{color:#22d3ee}.mut{color:#8b9bb4;font-size:13px}
@media(max-width:600px){.span2{grid-column:auto!important}.cc{padding:16px}.cc h1{font-size:24px}.big{font-size:24px}.tbl{font-size:12px}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
</style></head><body><div class="cc" id="app"><h1>Degen Bot's</h1><div class="sub">Loading…</div></div>
<script>
const COLORS={A:"#22d3ee",B:"#a78bfa",C:"#f472b6",D:"#34d399",E:"#fbbf24",L:"#22d3ee",S:"#f472b6",M:"#a78bfa"},GREEN="#34d399",RED="#f87171",MUTED="#8b9bb4";

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const txt=c=>c&&typeof c==="object"?c.text:c,col=c=>c&&typeof c==="object"?(c.tone==="success"?GREEN:c.tone==="danger"?RED:""):"";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pktFull(ms){const d=new Date(ms+5*3600e3),h=d.getUTCHours();return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}, ${h%12||12}:${String(d.getUTCMinutes()).padStart(2,"0")} ${h<12?"AM":"PM"}`}
function pktH(ts){const d=new Date((ts+5*3600)*1000),h=d.getUTCHours();return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}, ${h%12||12} ${h<12?"AM":"PM"}`}
const cnt=(v,{prefix="$",dec=2,signed=false}={})=>`<span class="cnt" data-v="${v}" data-p="${prefix}" data-d="${dec}" data-s="${signed?1:0}">${(signed?(v>=0?"+":"-"):"")+prefix+Math.abs(v).toFixed(dec)}</span>`;
function animate(first){document.querySelectorAll(".cnt").forEach(el=>{const v=+el.dataset.v,p=el.dataset.p,d=+el.dataset.d,s=el.dataset.s==="1",from=first?0:+(el.dataset.from||v),t0=performance.now();
 const step=t=>{const k=Math.min(1,(t-t0)/1200),x=from+(v-from)*(1-Math.pow(1-k,3));el.textContent=(s?(x>=0?"+":"-"):"")+p+Math.abs(x).toFixed(d);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
 setTimeout(()=>document.querySelectorAll(".bar>i").forEach(i=>i.style.width=i.dataset.w+"%"),50)}
function tbl(cols,rows,empty){if(!rows||!rows.length)return`<div class="mut" style="padding:6px 0">${empty||"No trades yet. It waits for a round with enough edge."}</div>`;
 return`<div class="scroll"><table class="tbl"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td style="color:${col(c)}">${esc(txt(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function card(b,i,unit){const c=COLORS[b.id]||"#22d3ee",n=b.wins+b.losses,wr=n?100*b.wins/n:0,up=b.pnlNum>=0,run=b.status==="running";
 const lab=b.paper===false?`<span class="ptag rtag">REAL</span>`:`<span class="ptag">PAPER</span>`;
 return`<div class="card" style="animation-delay:${i*.08}s"><div class="glow" style="box-shadow:0 0 22px ${c}55,inset 0 0 0 1px ${c}66"></div>
 <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:20px;font-weight:800;color:${c}">${esc(b.short||("Bot "+b.id))}${lab}</div><span class="tag" style="color:${c};border-color:${c}88">${esc(b.coin)}</span></div>
 <div style="font-size:13px;color:#c7d2e4;margin:6px 0 10px;min-height:34px">${esc(b.desc)}</div>
 <div class="big" style="color:${up?GREEN:RED}">${cnt(b.pnlNum,{signed:true})}</div>
 <div style="font-size:12px;color:${MUTED}">profit/loss · ${up?"+":""}${(100*b.pnlNum/b.start).toFixed(1)}% of bank</div>
 <div class="kv"><span>${unit||"Cash now"}</span><b>${cnt(b.cashNum)} <span style="color:${MUTED};font-weight:400">of $${b.start}</span></b></div>
 <div class="kv"><span>Wins · Losses</span><b><span style="color:${GREEN}">${b.wins}</span> · <span style="color:${RED}">${b.losses}</span></b></div>
 <div class="kv"><span>Win rate</span><b>${n?wr.toFixed(0)+"%":"—"}</b></div>
 <div class="bar"><i data-w="${n?wr:0}"></i></div>
 <div style="margin-top:12px;font-size:13px;display:flex;align-items:center;color:${run?GREEN:RED}"><span class="dot${run?" live":""}" style="background:${run?GREEN:RED}"></span>${run?"Running":"Stopped"}<span style="color:${MUTED};margin-left:auto">${esc(b.open)}</span></div></div>`}
function chart(BOTS){const W=900,H=300,P=44,all=BOTS.flatMap(b=>b.series);if(!all.length)return`<div class="mut">No settled trades yet.</div>`;
 const now=Date.now()/1000,t0=Math.min(...all.map(p=>p[0])),t1=Math.max(now,...all.map(p=>p[0])),ys=all.map(p=>p[1]).concat([0]),y0=Math.min(...ys),y1=Math.max(...ys),pad=(y1-y0)*.08||5;
 const X=t=>P+(t-t0)/(t1-t0||1)*(W-P-12),Y=v=>12+(y1+pad-v)/(y1-y0+2*pad)*(H-40);let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
 [0,.25,.5,.75,1].forEach(k=>{const v=y0-pad+k*(y1-y0+2*pad);s+=`<line x1="${P}" x2="${W-12}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(148,163,184,.12)"/><text x="${P-6}" y="${Y(v)+4}" fill="${MUTED}" font-size="11" text-anchor="end">${v.toFixed(0)}%</text>`});
 s+=`<line x1="${P}" x2="${W-12}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(226,232,240,.35)" stroke-dasharray="4 4"/>`;
 [0,.25,.5,.75,1].forEach((k,i)=>{s+=`<text x="${X(t0+k*(t1-t0))}" y="${H-8}" fill="${MUTED}" font-size="11" text-anchor="${i==0?"start":i==4?"end":"middle"}">${pktH(t0+k*(t1-t0))}</text>`});
 BOTS.filter(b=>b.series.length).forEach(b=>{const pts=b.series.concat([[now,b.series[b.series.length-1][1]]]),c=COLORS[b.id],l=pts[pts.length-1];
  s+=`<path class="line" d="${pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-width="2.2" style="filter:drop-shadow(0 0 4px ${c})"/><circle cx="${X(l[0])}" cy="${Y(l[1])}" r="4" fill="${c}"><animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/></circle>`});
 return s+"</svg>"}
function legend(BOTS){return`<div class="legend">${BOTS.map(b=>`<span><span class="dot" style="background:${COLORS[b.id]}"></span>${esc(b.short||"Bot "+b.id)} (${esc(b.coin)}) ${b.series.length?`${b.pnlNum>=0?"+":""}${(100*b.pnlNum/b.start).toFixed(1)}%`:"no trades yet"}</span>`).join("")}</div>`}
function details(b,cols,dcols,open){return`<details class="sec" data-k="${b.id}"${open?" open":""}><summary><span class="dot" style="background:${COLORS[b.id]}"></span>${esc(b.name)}<span style="margin-left:auto;color:${b.pnlNum>=0?GREEN:RED}">${esc(b.pnl)}</span><span style="color:${MUTED};font-weight:400">${esc(b.record)}</span></summary>
 <div class="mut" style="margin-bottom:6px">${esc(b.rule)} Cash ${esc(b.cash)} of $${b.start}, ${esc(b.open)}.</div>
 <details class="inner" data-k="${b.id}d" open><summary>Daily totals (PKT days)</summary>${tbl(dcols,b.daily)}</details>
 <details class="inner" data-k="${b.id}t"><summary>Full trade log (${b.bets.length} trades, newest first)</summary>${tbl(cols,b.bets)}</details></details>`}
const px=p=>p<0.01?(+p).toPrecision(4):(+p).toFixed(4);
let first=true;
function render(D){const st={};document.querySelectorAll("details[data-k]").forEach(d=>st[d.dataset.k]=d.open);const sy=scrollY;
 const P=D.poly||[],G=D.degen||[],L=D.live,Lb=G.find(b=>b.id==="L"),PB=G.filter(b=>b.id!=="L");
 if(Lb)Lb.short="Live wallet";PB.forEach(b=>b.short=b.id==="S"?"Sniper":"Meme swing");
 const live=P.filter(b=>b.status==="running").length+G.filter(b=>b.status==="running").length,tot=P.reduce((s,b)=>s+b.wins+b.losses,0);
 let h=`<h1>Degen Bot's</h1><div class="sub"><span class="dot live"></span>${live} of ${P.length+G.length} bots live · Snapshot as of ${pktFull(D.updatedTs)} PKT, refreshes every minute<br>The Degen live wallet trades real money. Everything marked PAPER is paper money only, no real trades. All times are Pakistan time (PKT).</div>`;
 // Degen live
 h+=`<h3>Degen live wallet <span class="ptag rtag">REAL MONEY</span></h3><div class="grid">${card(Lb,0,"Equity now")}
 <div class="card span2" style="animation-delay:.08s;grid-column:span 2;min-width:0"><div class="glow" style="box-shadow:0 0 22px #22d3ee33,inset 0 0 0 1px #22d3ee44"></div><div style="font-weight:700;margin-bottom:6px">Open positions (${L.open.length})</div>
 ${tbl(["Token","Cost","Entry → now","Unrealized","Stop"],L.open.map(p=>[p.token+(p.halfSold?" (half sold)":""),"$"+p.cost.toFixed(2),px(p.entry)+" → "+px(p.last),{text:(p.pnl>=0?"+$":"-$")+Math.abs(p.pnl).toFixed(2)+" ("+(p.pct>=0?"+":"")+p.pct+"%)",tone:p.pnl>=0?"success":"danger"},px(p.stop)+(p.tp?" · ½ at "+px(p.tp):"")]),"No open positions. Waiting for a coin that passes every rule.")}
 <div class="kv"><span>SOL</span><b>${L.sol} SOL (${cnt(L.solValue)})</b></div><div class="kv"><span>Realized P&L</span><b style="color:${L.realized>=0?GREEN:RED}">${cnt(L.realized,{signed:true})}</b></div>
 <div class="mut" style="margin-top:8px">Wallet <a class="addr" href="https://solscan.io/account/${esc(L.address)}" target="_blank">${esc(L.address)}</a><br>Stops checked every minute (last ${esc(L.watcherTick||"—")})</div></div></div>
 <div class="panel"><h2>Live wallet % return over time</h2><div class="mut">Equity vs the $20 start.</div>${legend([Lb])}${chart([Lb])}</div>
 <div class="panel"><h2>Live wallet details</h2><div class="mut">Daily totals and every closed trade, with $ and % P&L.</div>${details(Lb,["Time (PKT)","Token","Cost","Sold for","Reason","P&L"],["Date (PKT)","Trades","Wins","Losses","Win rate","P&L"],true)}</div>`;
 // Degen paper
 h+=`<h3>Degen paper bots <span class="ptag">PAPER</span></h3><div class="grid">${PB.map((b,i)=>card(b,i)).join("")}</div>
 <div class="panel"><h2>% return over time</h2><div class="mut">Paper profit as a % of each bot's $20 bank.</div>${legend(PB)}${chart(PB)}</div>
 <div class="panel"><h2>Bot details</h2><div class="mut">Click a bot to see its daily totals and every trade.</div>${PB.map(b=>details(b,["Time (PKT)","Token","Size","Hold","Exit","P&L"],["Date (PKT)","Trades","Wins","Losses","Win rate","P&L"])).join("")}</div>`;
 // Polymarket
 h+=`<h3>$10 To $100 · Polymarket 5-min bots <span class="ptag">PAPER</span></h3><div class="sub" style="margin:0 0 14px">${P.filter(b=>b.status==="running").length} of ${P.length} bots live · ${tot} settled paper trades. Each bot bets on whether BTC or Solana ends each 5-minute Polymarket round up or down.</div>
 <div id="pmslot"></div>
 <div class="grid">${P.map((b,i)=>card(b,i)).join("")}</div>
 <div class="panel"><h2>% return over time</h2><div class="mut">Profit after fees as a % of each bot's starting bank, so bots with different bank sizes compare fairly.</div>${legend(P)}${chart(P)}</div>
 <div class="panel"><h2>Bot details</h2><div class="mut">Click a bot to see its daily totals and every trade.</div>${P.map(b=>details(b,["Time (PKT)","Side","Entry price","Cost","Result","P&L after fees"],["Date (PKT)","Trades","Wins","Losses","Win rate","P&L after fees"])).join("")}</div>`;
 const app=document.getElementById("app");if(!first)app.classList.add("noanim");app.innerHTML=h;
 document.querySelectorAll("details[data-k]").forEach(d=>{if(d.dataset.k in st)d.open=st[d.dataset.k]});if(!first)scrollTo(0,sy);pmMount();animate(first);first=false}
async function load(){try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});render(await r.json())}catch(e){const s=document.querySelector(".sub");if(s)s.textContent="Couldn't load data, retrying in a minute…"}}
load();setInterval(load,60000);

// ===== Live Polymarket 5-min Up/Down rounds (BTC + SOL). Read-only public data, no keys. =====
const PM_COINS=[{c:"btc",n:"Bitcoin",s:"BTC",cb:"BTC-USD",col:"#fbbf24"},{c:"sol",n:"Solana",s:"SOL",cb:"SOL-USD",col:"#a78bfa"}];
const PM={el:null,st:{},timer:null};
const pmT=sec=>{const d=new Date((sec+5*3600)*1000),h=d.getUTCHours();return`${h%12||12}:${String(d.getUTCMinutes()).padStart(2,"0")}`};
const pmAP=sec=>new Date((sec+5*3600)*1000).getUTCHours()<12?"AM":"PM";
const pmJ=async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()};
function pmMount(){if(!PM.el)pmInit();const slot=document.getElementById("pmslot");if(slot&&PM.el.parentNode!==slot)slot.appendChild(PM.el)}
function pmInit(){PM.el=document.createElement("div");PM.el.className="panel pm";PM.el.innerHTML=`<style>
.pm .pmg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:12px}
.pm .pc{position:relative;background:rgba(10,16,32,.75);border:1px solid rgba(148,163,184,.15);border-radius:14px;padding:14px;overflow:hidden}
.pm .pc .gl{position:absolute;inset:-1px;border-radius:14px;pointer-events:none;animation:glow 3.2s ease-in-out infinite}
.pm .hd{display:flex;align-items:center;gap:8px}.pm .hd b{font-size:16px}.pm .hd a{margin-left:auto;font-size:12px}
.pm .win{font-size:12.5px;color:#8b9bb4;margin-top:2px}
.pm .ud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pm .ud div{border-radius:10px;padding:8px 10px;border:1px solid}.pm .ud .u{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.3)}.pm .ud .d{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3)}
.pm .ud small{display:block;font-size:11px;color:#8b9bb4;letter-spacing:.5px}.pm .ud span{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.pm .tb{height:5px;border-radius:4px;background:rgba(148,163,184,.15);overflow:hidden;margin-top:12px}.pm .tb i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa);transition:width 1s linear}
.pm .row{display:flex;justify-content:space-between;font-size:12.5px;color:#8b9bb4;margin-top:6px;font-variant-numeric:tabular-nums}.pm .row b{color:#e6edf7;font-weight:600}
.pm svg{display:block;width:100%;height:auto;margin-top:10px}
.pm .hist{display:flex;gap:5px;align-items:center;margin-top:10px;font-size:11.5px;color:#8b9bb4;flex-wrap:wrap}
.pm .hist i{font-style:normal;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px}
.pm .hist .U{background:rgba(52,211,153,.15);color:#34d399}.pm .hist .D{background:rgba(248,113,113,.15);color:#f87171}.pm .hist .Q{background:rgba(148,163,184,.12);color:#8b9bb4}
.pm .flash{animation:fl .6s ease}@keyframes fl{0%{text-shadow:0 0 12px currentColor}100%{text-shadow:none}}
</style><h2><span class="dot live"></span>Live Polymarket rounds</h2><div class="mut">The real 5-minute BTC and SOL Up/Down markets your bots trade, straight from Polymarket. The chart shows the market's chance of "Up" this round, updating every 2 seconds. Price from Coinbase.</div><div class="pmg">${PM_COINS.map(k=>`<div class="pc" id="pm-${k.c}"><div class="gl" style="box-shadow:0 0 22px ${k.col}44,inset 0 0 0 1px ${k.col}55"></div><div class="mut">Loading ${k.n}…</div></div>`).join("")}</div>`;
 PM_COINS.forEach(k=>PM.st[k.c]={k,round:0,pts:[],up:null,spot:null,spot0:null,hist:[],tok:null,slug:"",busy:false});
 pmTick();PM.timer=setInterval(pmTick,2000);setInterval(pmSpot,3000);pmSpot()}
async function pmRound(S,t){S.round=t;S.pts=[];S.up=null;S.tok=null;S.spot0=S.spot;S.slug=`${S.k.c}-updown-5m-${t}`;
 try{const ev=(await pmJ(`https://gamma-api.polymarket.com/events?slug=${S.slug}`))[0],m=ev&&ev.markets&&ev.markets[0];if(!m)throw 0;
  S.tok=JSON.parse(m.clobTokenIds)[0];S.up=+JSON.parse(m.outcomePrices)[0];
  try{const h=await pmJ(`https://clob.polymarket.com/prices-history?market=${S.tok}&startTs=${t}&endTs=${t+300}&fidelity=1`);(h.history||[]).forEach(p=>{if(p.t>=t)S.pts.push([p.t,+p.p])})}catch(e){}
 }catch(e){S.round=0}
 pmHist(S,t)}
async function pmHist(S,t){const out=[];for(let i=1;i<=6;i++){const sl=`${S.k.c}-updown-5m-${t-300*i}`;try{const m=(await pmJ(`https://gamma-api.polymarket.com/events?slug=${sl}`))[0].markets[0],p=JSON.parse(m.outcomePrices).map(Number);out.push({t:t-300*i,r:p[0]>=.99?"U":p[1]>=.99?"D":"Q"})}catch(e){out.push({t:t-300*i,r:"Q"})}}S.hist=out;pmDraw(S)}
async function pmSpot(){for(const c in PM.st){const S=PM.st[c];try{const j=await pmJ(`https://api.coinbase.com/v2/prices/${S.k.cb}/spot`);S.spot=+j.data.amount;if(S.spot0==null)S.spot0=S.spot}catch(e){}}}
async function pmTick(){const now=Date.now()/1000,t=Math.floor(now/300)*300;
 for(const c in PM.st){const S=PM.st[c];if(S.busy)continue;S.busy=true;
  try{if(S.round!==t)await pmRound(S,t);
   if(S.tok){const j=await pmJ(`https://clob.polymarket.com/midpoint?token_id=${S.tok}`);const v=+j.mid;if(!isNaN(v)){S.flash=S.up!=null&&Math.round(v*100)!==Math.round(S.up*100);S.up=v;S.pts.push([now,v])}}
  }catch(e){}S.busy=false;pmDraw(S)}}
function pmChart(S){const W=600,H=150,L=34,R=8,T=8,B=20,t0=S.round,t1=S.round+300,X=t=>L+(t-t0)/300*(W-L-R),Y=v=>T+(1-v)*(H-T-B);
 let s=`<svg viewBox="0 0 ${W} ${H}">`;[0,.25,.5,.75,1].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(148,163,184,${v==.5?.35:.1})"${v==.5?' stroke-dasharray="4 4"':""}/><text x="${L-5}" y="${Y(v)+4}" fill="#8b9bb4" font-size="10" text-anchor="end">${v*100}%</text>`});
 [0,1,2,3,4,5].forEach(i=>{s+=`<text x="${X(t0+i*60)}" y="${H-5}" fill="#8b9bb4" font-size="10" text-anchor="${i==0?"start":i==5?"end":"middle"}">${pmT(t0+i*60)}</text>`});
 const P=S.pts.filter(p=>p[0]>=t0&&p[0]<=t1);if(P.length){const c=S.up>=.5?GREEN:RED,d=P.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" "),l=P[P.length-1];
  s+=`<defs><linearGradient id="pmg${S.k.c}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".28"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${X(l[0]).toFixed(1)},${Y(0)} L${X(P[0][0]).toFixed(1)},${Y(0)} Z" fill="url(#pmg${S.k.c})"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" style="filter:drop-shadow(0 0 4px ${c})"/><circle cx="${X(l[0])}" cy="${Y(l[1])}" r="4" fill="${c}"><animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/></circle>`}
 return s+"</svg>"}
function pmDraw(S){const el=document.getElementById(`pm-${S.k.c}`);if(!el)return;const k=S.k,now=Date.now()/1000;
 if(!S.round){el.innerHTML=`<div class="gl" style="box-shadow:0 0 22px ${k.col}44,inset 0 0 0 1px ${k.col}55"></div><b>${k.n}</b><div class="mut" style="margin-top:6px">Waiting for the next round to open on Polymarket…</div>`;return}
 const left=Math.max(0,S.round+300-now),up=S.up==null?null:Math.round(S.up*100),ch=null,dp=k.s=="BTC"?2:3;
 el.innerHTML=`<div class="gl" style="box-shadow:0 0 22px ${k.col}44,inset 0 0 0 1px ${k.col}55"></div>
 <div class="hd"><b style="color:${k.col}">${k.n}</b><span class="tag" style="color:${k.col};border-color:${k.col}88">${k.s} · 5 min</span><a href="https://polymarket.com/event/${S.slug}" target="_blank" rel="noopener">Polymarket ↗</a></div>
 <div class="win">Round ${pmT(S.round)}–${pmT(S.round+300)} ${pmAP(S.round+300)} PKT</div>
 <div class="ud"><div class="u"><small>UP</small><span class="${S.flash?"flash":""}" style="color:${GREEN}">${up==null?"—":up+"%"}</span></div><div class="d"><small>DOWN</small><span class="${S.flash?"flash":""}" style="color:${RED}">${up==null?"—":100-up+"%"}</span></div></div>
 ${pmChart(S)}
 <div class="tb"><i style="width:${(300-left)/3}%"></i></div>
 <div class="row"><span>Time left <b>${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,"0")}</b></span><span>${k.s} <b>${S.spot==null?"—":"$"+S.spot.toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp})}</b>${ch==null?"":` <span style="color:${ch>=0?GREEN:RED}">${ch>=0?"▲":"▼"}${Math.abs(ch).toFixed(dp)}</span>`}</span></div>
 <div class="hist">Last rounds: ${S.hist.map(h=>`<i class="${h.r}" title="${pmT(h.t)} PKT">${h.r=="U"?"UP":h.r=="D"?"DOWN":"…"}</i>`).join("")||"…"}</div>`}
</script><style>.noanim .card,.noanim .panel,.noanim .line{animation:none!important;stroke-dashoffset:0}</style></body></html>
