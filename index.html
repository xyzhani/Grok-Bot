<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Degen Bot's</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#05070f}
.cc{background:radial-gradient(1200px 600px at 10% -10%,#12234a 0%,#070b17 55%,#05070f 100%);color:#e6edf7;font-family:Inter,system-ui,-apple-system,sans-serif;padding:28px;min-height:100vh}
.cc h1{font-size:30px;margin:0;letter-spacing:.5px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.cc h3{font-size:20px;margin:30px 0 12px;color:#e6edf7;letter-spacing:.4px}
.sub{color:#8b9bb4;font-size:14px;margin:6px 0 22px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.15);border-radius:16px;padding:16px;backdrop-filter:blur(6px);animation:rise .6s ease both;transition:transform .25s}
.card:hover{transform:translateY(-3px)}
.glow{position:absolute;inset:-1px;border-radius:16px;pointer-events:none;animation:glow 3.2s ease-in-out infinite}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;letter-spacing:.6px}
.ptag{font-size:10px;padding:1px 7px;border-radius:999px;background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid #fbbf2488;margin-left:6px;letter-spacing:.6px;font-weight:600}
.rtag{background:rgba(52,211,153,.15);color:#34d399;border-color:#34d39988}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}
.live{background:#34d399;animation:pulse 1.6s infinite}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;font-size:13px;color:#8b9bb4;margin-top:4px}.kv b{color:#e6edf7;font-weight:600}
.bar{height:6px;border-radius:4px;background:rgba(248,113,113,.35);overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:#34d399;transition:width 1.2s ease;width:0}
.panel{margin-top:22px;background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.15);border-radius:16px;padding:18px;animation:rise .7s ease both}
.panel h2{font-size:17px;margin:0 0 4px}
details.sec{margin-top:12px;background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.14);border-radius:14px;padding:4px 16px}
details.sec>summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'\25B8';transition:transform .2s;color:#8b9bb4}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.inner{margin:8px 0 14px}details.inner>summary{cursor:pointer;color:#8b9bb4;font-size:14px;padding:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{color:#8b9bb4;font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid rgba(148,163,184,.2);position:sticky;top:0;background:#0b1224}
.tbl td{padding:6px 8px;border-bottom:1px solid rgba(148,163,184,.08)}.tbl tr:hover td{background:rgba(34,211,238,.05)}
.scroll{max-height:420px;overflow:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#8b9bb4;margin:8px 0}
.line{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 2.2s ease forwards}
.addr{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;color:#22d3ee}
a{color:#22d3ee}.mut{color:#8b9bb4;font-size:13px}
@media(max-width:600px){.span2{grid-column:auto!important}.cc{padding:16px}.cc h1{font-size:24px}.big{font-size:24px}.tbl{font-size:12px}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
</style></head><body><div class="cc" id="app"><h1>Degen Bot's</h1><div class="sub">Loading…</div></div>
<script>
const COLORS={A:"#22d3ee",B:"#a78bfa",C:"#f472b6",D:"#34d399",E:"#fbbf24",L:"#22d3ee",S:"#f472b6",M:"#a78bfa"},GREEN="#34d399",RED="#f87171",MUTED="#8b9bb4";

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const txt=c=>c&&typeof c==="object"?c.text:c,col=c=>c&&typeof c==="object"?(c.tone==="success"?GREEN:c.tone==="danger"?RED:""):"";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pktFull(ms){const d=new Date(ms+5*3600e3),h=d.getUTCHours();return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}, ${h%12||12}:${String(d.getUTCMinutes()).padStart(2,"0")} ${h<12?"AM":"PM"}`}
function pktH(ts){const d=new Date((ts+5*3600)*1000),h=d.getUTCHours();return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}, ${h%12||12} ${h<12?"AM":"PM"}`}
const cnt=(v,{prefix="$",dec=2,signed=false}={})=>`<span class="cnt" data-v="${v}" data-p="${prefix}" data-d="${dec}" data-s="${signed?1:0}">${(signed?(v>=0?"+":"-"):"")+prefix+Math.abs(v).toFixed(dec)}</span>`;
function animate(first){document.querySelectorAll(".cnt").forEach(el=>{const v=+el.dataset.v,p=el.dataset.p,d=+el.dataset.d,s=el.dataset.s==="1",from=first?0:+(el.dataset.from||v),t0=performance.now();
 const step=t=>{const k=Math.min(1,(t-t0)/1200),x=from+(v-from)*(1-Math.pow(1-k,3));el.textContent=(s?(x>=0?"+":"-"):"")+p+Math.abs(x).toFixed(d);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
 setTimeout(()=>document.querySelectorAll(".bar>i").forEach(i=>i.style.width=i.dataset.w+"%"),50)}
function tbl(cols,rows,empty){if(!rows||!rows.length)return`<div class="mut" style="padding:6px 0">${empty||"No trades yet. It waits for a round with enough edge."}</div>`;
 return`<div class="scroll"><table class="tbl"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td style="color:${col(c)}">${esc(txt(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function card(b,i,unit){const c=COLORS[b.id]||"#22d3ee",n=b.wins+b.losses,wr=n?100*b.wins/n:0,up=b.pnlNum>=0,run=b.status==="running";
 const lab=b.paper===false?`<span class="ptag rtag">REAL</span>`:`<span class="ptag">PAPER</span>`;
 return`<div class="card" style="animation-delay:${i*.08}s"><div class="glow" style="box-shadow:0 0 22px ${c}55,inset 0 0 0 1px ${c}66"></div>
 <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:20px;font-weight:800;color:${c}">${esc(b.short||("Bot "+b.id))}${lab}</div><span class="tag" style="color:${c};border-color:${c}88">${esc(b.coin)}</span></div>
 <div style="font-size:13px;color:#c7d2e4;margin:6px 0 10px;min-height:34px">${esc(b.desc)}</div>
 <div class="big" style="color:${up?GREEN:RED}">${cnt(b.pnlNum,{signed:true})}</div>
 <div style="font-size:12px;color:${MUTED}">profit/loss · ${up?"+":""}${(100*b.pnlNum/b.start).toFixed(1)}% of bank</div>
 <div class="kv"><span>${unit||"Cash now"}</span><b>${cnt(b.cashNum)} <span style="color:${MUTED};font-weight:400">of $${b.start}</span></b></div>
 <div class="kv"><span>Wins · Losses</span><b><span style="color:${GREEN}">${b.wins}</span> · <span style="color:${RED}">${b.losses}</span></b></div>
 <div class="kv"><span>Win rate</span><b>${n?wr.toFixed(0)+"%":"—"}</b></div>
 <div class="bar"><i data-w="${n?wr:0}"></i></div>
 <div style="margin-top:12px;font-size:13px;display:flex;align-items:center;color:${run?GREEN:RED}"><span class="dot${run?" live":""}" style="background:${run?GREEN:RED}"></span>${run?"Running":"Stopped"}<span style="color:${MUTED};margin-left:auto">${esc(b.open)}</span></div></div>`}
function chart(BOTS){const W=900,H=300,P=44,all=BOTS.flatMap(b=>b.series);if(!all.length)return`<div class="mut">No settled trades yet.</div>`;
 const now=Date.now()/1000,t0=Math.min(...all.map(p=>p[0])),t1=Math.max(now,...all.map(p=>p[0])),ys=all.map(p=>p[1]).concat([0]),y0=Math.min(...ys),y1=Math.max(...ys),pad=(y1-y0)*.08||5;
 const X=t=>P+(t-t0)/(t1-t0||1)*(W-P-12),Y=v=>12+(y1+pad-v)/(y1-y0+2*pad)*(H-40);let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
 [0,.25,.5,.75,1].forEach(k=>{const v=y0-pad+k*(y1-y0+2*pad);s+=`<line x1="${P}" x2="${W-12}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(148,163,184,.12)"/><text x="${P-6}" y="${Y(v)+4}" fill="${MUTED}" font-size="11" text-anchor="end">${v.toFixed(0)}%</text>`});
 s+=`<line x1="${P}" x2="${W-12}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(226,232,240,.35)" stroke-dasharray="4 4"/>`;
 [0,.25,.5,.75,1].forEach((k,i)=>{s+=`<text x="${X(t0+k*(t1-t0))}" y="${H-8}" fill="${MUTED}" font-size="11" text-anchor="${i==0?"start":i==4?"end":"middle"}">${pktH(t0+k*(t1-t0))}</text>`});
 BOTS.filter(b=>b.series.length).forEach(b=>{const pts=b.series.concat([[now,b.series[b.series.length-1][1]]]),c=COLORS[b.id],l=pts[pts.length-1];
  s+=`<path class="line" d="${pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-width="2.2" style="filter:drop-shadow(0 0 4px ${c})"/><circle cx="${X(l[0])}" cy="${Y(l[1])}" r="4" fill="${c}"><animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/></circle>`});
 return s+"</svg>"}
function legend(BOTS){return`<div class="legend">${BOTS.map(b=>`<span><span class="dot" style="background:${COLORS[b.id]}"></span>${esc(b.short||"Bot "+b.id)} (${esc(b.coin)}) ${b.series.length?`${b.pnlNum>=0?"+":""}${(100*b.pnlNum/b.start).toFixed(1)}%`:"no trades yet"}</span>`).join("")}</div>`}
function details(b,cols,dcols,open){return`<details class="sec" data-k="${b.id}"${open?" open":""}><summary><span class="dot" style="background:${COLORS[b.id]}"></span>${esc(b.name)}<span style="margin-left:auto;color:${b.pnlNum>=0?GREEN:RED}">${esc(b.pnl)}</span><span style="color:${MUTED};font-weight:400">${esc(b.record)}</span></summary>
 <div class="mut" style="margin-bottom:6px">${esc(b.rule)} Cash ${esc(b.cash)} of $${b.start}, ${esc(b.open)}.</div>
 <details class="inner" data-k="${b.id}d" open><summary>Daily totals (PKT days)</summary>${tbl(dcols,b.daily)}</details>
 <details class="inner" data-k="${b.id}t"><summary>Full trade log (${b.bets.length} trades, newest first)</summary>${tbl(cols,b.bets)}</details></details>`}
const px=p=>p<0.01?(+p).toPrecision(4):(+p).toFixed(4);
let first=true;
const TABS=[["live","Degen Live wallet"],["meme","Meme Sniper / Swing"],["btc","Polymarket BTC 5-Min"],["sol","Polymarket SOL 5-Min"]];let TAB=(location.hash.slice(1)||"live"),LD=null;
function setTab(k){TAB=k;try{history.replaceState(null,"","#"+k)}catch(e){}first=true;if(LD)render(LD);scrollTo(0,0)}
function render(D){LD=D;const st={};document.querySelectorAll("details[data-k]").forEach(d=>st[d.dataset.k]=d.open);const sy=scrollY;
 const P=D.poly||[],G=D.degen||[],L=D.live,Lb=G.find(b=>b.id==="L"),PB=G.filter(b=>b.id!=="L");
 if(Lb)Lb.short="Live wallet";PB.forEach(b=>b.short=b.id==="S"?"Sniper":"Meme swing");
 const live=P.filter(b=>b.status==="running").length+G.filter(b=>b.status==="running").length,tot=P.reduce((s,b)=>s+b.wins+b.losses,0);
 let h=`<h1>Degen Bot's</h1><div class="sub"><span class="dot live"></span>${live} of ${P.length+G.length} bots live · Snapshot as of ${pktFull(D.updatedTs)} PKT, refreshes every minute<br>The Degen live wallet trades real money. Everything marked PAPER is paper money only, no real trades. All times are Pakistan time (PKT).</div>`;
 // Tab 1: Degen live
 const T={};T.live=`<h3>Degen live wallet <span class="ptag rtag">REAL MONEY</span></h3><div class="grid">${card(Lb,0,"Equity now")}
 <div class="card span2" style="animation-delay:.08s;grid-column:span 2;min-width:0"><div class="glow" style="box-shadow:0 0 22px #22d3ee33,inset 0 0 0 1px #22d3ee44"></div><div style="font-weight:700;margin-bottom:6px">Open positions (${L.open.length})</div>
 ${tbl(["Token","Cost","Entry → now","Unrealized","Stop"],L.open.map(p=>[p.token+(p.halfSold?" (half sold)":""),"$"+p.cost.toFixed(2),px(p.entry)+" → "+px(p.last),{text:(p.pnl>=0?"+$":"-$")+Math.abs(p.pnl).toFixed(2)+" ("+(p.pct>=0?"+":"")+p.pct+"%)",tone:p.pnl>=0?"success":"danger"},px(p.stop)+(p.tp?" · ½ at "+px(p.tp):"")]),"No open positions. Waiting for a coin that passes every rule.")}
 <div class="kv"><span>SOL</span><b>${L.sol} SOL (${cnt(L.solValue)})</b></div><div class="kv"><span>Realized P&L</span><b style="color:${L.realized>=0?GREEN:RED}">${cnt(L.realized,{signed:true})}</b></div>
 <div class="mut" style="margin-top:8px">Wallet <a class="addr" href="https://solscan.io/account/${esc(L.address)}" target="_blank">${esc(L.address)}</a><br>Stops checked every minute (last ${esc(L.watcherTick||"—")})</div></div></div>
 <div class="panel"><h2>Live wallet % return over time</h2><div class="mut">Equity vs the $20 start.</div>${legend([Lb])}${chart([Lb])}</div>
 <div class="panel"><h2>Live wallet details</h2><div class="mut">Daily totals and every closed trade, with $ and % P&L.</div>${details(Lb,["Time (PKT)","Token","Cost","Sold for","Reason","P&L"],["Date (PKT)","Trades","Wins","Losses","Win rate","P&L"],true)}</div>`;
 // Tab 2: Meme sniper / swing
 T.meme=`<h3>Meme Sniper / Swing bots <span class="ptag">PAPER</span></h3><div class="grid">${PB.map((b,i)=>card(b,i)).join("")}</div>
 <div class="panel"><h2>% return over time</h2><div class="mut">Paper profit as a % of each bot's $20 bank.</div>${legend(PB)}${chart(PB)}</div>
 <div class="panel"><h2>Bot details</h2><div class="mut">Tap a bot to see its daily totals and every trade.</div>${PB.map(b=>details(b,["Time (PKT)","Token","Size","Hold","Exit","P&L"],["Date (PKT)","Trades","Wins","Losses","Win rate","P&L"])).join("")}</div>`;
 // Tabs 3+4: Polymarket by coin
 const poly=(coin,c)=>{const B=P.filter(b=>b.coin===coin),n=B.reduce((s,b)=>s+b.wins+b.losses,0);return`<h3>Polymarket ${coin} 5-Min <span class="ptag">PAPER</span></h3><div id="pmslot-${c}"></div><div class="sub" style="margin:18px 0 14px">${B.filter(b=>b.status==="running").length} of ${B.length} ${coin} bots live · ${n} settled paper trades. Each bot bets on whether ${coin==="BTC"?"Bitcoin":"Solana"} ends each 5-minute Polymarket round up or down.</div>
 <div class="grid">${B.map((b,i)=>card(b,i)).join("")||'<div class="mut">No bots on this coin.</div>'}</div>
 <div class="panel"><h2>% return over time</h2><div class="mut">Profit after fees as a % of each bot's starting bank, so bots with different bank sizes compare fairly.</div>${legend(B)}${chart(B)}</div>
 <div class="panel"><h2>Bot details</h2><div class="mut">Tap a bot to see its daily totals and every trade.</div>${B.map(b=>details(b,["Time (PKT)","Side","Entry price","Cost","Result","P&L after fees"],["Date (PKT)","Trades","Wins","Losses","Win rate","P&L after fees"])).join("")}</div>`};
 T.btc=poly("BTC","btc");T.sol=poly("SOL","sol");
 if(!T[TAB])TAB="live";
 h+=`<div class="tabs">${TABS.map(([k,n])=>`<button class="${k===TAB?"on":""}" onclick="setTab('${k}')">${n}</button>`).join("")}</div>`+TABS.map(([k])=>`<div class="tabp" style="display:${k===TAB?"block":"none"}">${T[k]}</div>`).join("");
 const app=document.getElementById("app");if(!first)app.classList.add("noanim");app.innerHTML=h;
 document.querySelectorAll("details[data-k]").forEach(d=>{if(d.dataset.k in st)d.open=st[d.dataset.k]});if(!first)scrollTo(0,sy);PM.D=D;pmMount();animate(first);first=false}
async function load(){try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});render(await r.json())}catch(e){const s=document.querySelector(".sub");if(s)s.textContent="Couldn't load data, retrying in a minute…"}}
load();setInterval(load,60000);

// ===== Live Polymarket 5-min Up/Down rounds (BTC + SOL). Read-only public data, no keys. =====
// Price feed: Polymarket's live Chainlink stream (same price their site shows). Price to beat = Chainlink price at the round's start second.
const PM_COINS=[{c:"btc",n:"BTC",cb:"BTC-USD",col:"#f7931a",dp:2},{c:"sol",n:"SOL",cb:"SOL-USD",col:"#9945ff",dp:2}];
const PM={el:null,st:{}};
const pmClock=sec=>{const d=new Date((sec+5*3600)*1000),h=d.getUTCHours();return`${h%12||12}:${String(d.getUTCMinutes()).padStart(2,"0")}`};
const pmAP=sec=>new Date((sec+5*3600)*1000).getUTCHours()<12?"AM":"PM";
const pmSec=sec=>{const d=new Date((sec+5*3600)*1000),h=d.getUTCHours();return`${h%12||12}:${String(d.getUTCMinutes()).padStart(2,"0")}:${String(d.getUTCSeconds()).padStart(2,"0")}`};
const pmJ=async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()};
const pmUsd=(v,dp)=>"$"+(+v).toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp});
function pmMount(){if(!PM.el)pmInit();PM_COINS.forEach(k=>{const slot=document.getElementById("pmslot-"+k.c),el=PM.cards[k.c];if(slot&&el.parentNode!==slot)slot.appendChild(el)})}
function pmInit(){PM.el=document.createElement("style");PM.cards={};PM.el.textContent=`
.pm .pmg{display:grid;grid-template-columns:minmax(0,640px);gap:14px;margin-top:12px}
.pm .pc{position:relative;background:#0b0f16;border:1px solid rgba(148,163,184,.15);border-radius:16px;padding:16px;overflow:hidden}
.pm .pc .gl{position:absolute;inset:-1px;border-radius:16px;pointer-events:none;animation:glow 3.2s ease-in-out infinite}
.pm .hd{display:flex;align-items:center;gap:12px}
.pm .ic{width:44px;height:44px;border-radius:11px;background:#000 center/cover;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.pm .tt{flex:1;min-width:0}.pm .tt b{display:block;font-size:17px;line-height:1.2}.pm .tt small{color:#8b9bb4;font-size:13px}
.pm .cd{display:flex;gap:10px;text-align:center;flex:none}.pm .cd b{display:block;font-size:26px;line-height:1;color:#f87171;font-variant-numeric:tabular-nums;font-weight:700}.pm .cd small{font-size:9.5px;color:#8b9bb4;letter-spacing:.8px}
.pm .px{display:flex;align-items:flex-end;gap:14px;margin-top:16px;flex-wrap:wrap}.pm .px>div{min-width:0}
.pm .px>div small{display:block;font-size:12px;color:#8b9bb4;margin-bottom:3px}
.pm .px .ptb b{font-size:clamp(19px,5.6vw,24px);color:#c9d1dd;font-variant-numeric:tabular-nums}
.pm .px .sep{width:1px;align-self:stretch;background:rgba(148,163,184,.25)}
.pm .px .cur small{color:var(--cc)}.pm .px .cur b{font-size:clamp(21px,6.4vw,28px);color:var(--cc);font-variant-numeric:tabular-nums;font-weight:700}
.pm .df{font-weight:700;font-size:12px;margin-left:6px}
.pm svg{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.pm .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pm .btns a{display:block;text-align:center;padding:12px 8px;border-radius:12px;font-weight:600;font-size:16px;color:#fff;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pm .btns a b{font-size:19px;font-variant-numeric:tabular-nums}
.pm .btns .u{background:#0a8a3a}.pm .btns .d{background:#d61a1a}
.pm .sub2{display:flex;justify-content:space-between;font-size:12px;color:#8b9bb4;margin-top:8px;gap:8px;flex-wrap:wrap}
.pm .hist{display:flex;gap:5px;align-items:center;margin-top:10px;font-size:11.5px;color:#8b9bb4;flex-wrap:wrap}
.pm .hist i{font-style:normal;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px}
.pm .hist .U{background:rgba(52,211,153,.15);color:#34d399}.pm .hist .D{background:rgba(248,113,113,.15);color:#f87171}.pm .hist .Q{background:rgba(148,163,184,.12);color:#8b9bb4}
`;document.head.appendChild(PM.el);
 PM_COINS.forEach(k=>{const el=PM.cards[k.c]=document.createElement("div");el.className="panel pm";el.style.marginTop="0";el.innerHTML=`<h2><span class="dot live"></span>Live ${k.n} round</h2><div class="mut">The real ${k.n} 5-minute Up/Down market your bots trade, live from Polymarket. Price is the same Chainlink feed Polymarket settles on. Up/Down prices are what one share costs right now.</div><div class="pmg"><div class="pc" id="pm-${k.c}"><div class="mut">Loading ${k.n}…</div></div></div>`});
 PM_COINS.forEach(k=>{const S=PM.st[k.c]={k,round:0,pts:[],ptb:{},cur:null,upAsk:null,dnAsk:null,upTok:null,dnTok:null,slug:"",icon:"",hist:[],busy:false};pmWS(S)});
 setInterval(pmTick,2000);setInterval(()=>PM_COINS.forEach(k=>pmDraw(PM.st[k.c])),1000);pmTick()}
function pmWS(S){let ws;try{ws=new WebSocket("wss://ws-live-data.polymarket.com")}catch(e){return setTimeout(()=>pmWS(S),5000)}
 let ping;ws.onopen=()=>{ws.send(JSON.stringify({action:"subscribe",subscriptions:[{topic:"crypto_prices_chainlink",type:"*",filters:JSON.stringify({symbol:S.k.c+"/usd"})}]}));ping=setInterval(()=>{try{ws.send("PING")}catch(e){}},5000)};
 ws.onmessage=e=>{let j;try{j=JSON.parse(e.data)}catch(x){return}const p=j&&j.payload;if(!p)return;
  const add=(ts,v)=>{const t=Math.round(ts/1000);if(!S.pts.length||t>S.pts[S.pts.length-1][0])S.pts.push([t,+v]);S.cur=+v};
  if(Array.isArray(p.data))p.data.forEach(d=>add(d.timestamp,d.value));else if(p.value!=null)add(p.timestamp,p.value);
  const cut=Date.now()/1000-900;while(S.pts.length&&S.pts[0][0]<cut)S.pts.shift()};
 ws.onclose=()=>{clearInterval(ping);setTimeout(()=>pmWS(S),3000)};ws.onerror=()=>{try{ws.close()}catch(e){}}}
async function pmRound(S,t){S.round=t;S.upTok=S.dnTok=null;S.upAsk=S.dnAsk=null;S.slug=`${S.k.c}-updown-5m-${t}`;
 try{const ev=(await pmJ(`https://gamma-api.polymarket.com/events?slug=${S.slug}`))[0],m=ev&&ev.markets&&ev.markets[0];if(!m)throw 0;
  [S.upTok,S.dnTok]=JSON.parse(m.clobTokenIds);S.icon=ev.icon||m.icon||"";const op=JSON.parse(m.outcomePrices).map(Number);S.upAsk=op[0];S.dnAsk=op[1];
 }catch(e){S.round=0}pmHist(S,t)}
async function pmHist(S,t){const out=[];for(let i=1;i<=6;i++){const sl=`${S.k.c}-updown-5m-${t-300*i}`;try{const m=(await pmJ(`https://gamma-api.polymarket.com/events?slug=${sl}`))[0].markets[0],p=JSON.parse(m.outcomePrices).map(Number);out.push({t:t-300*i,r:p[0]>=.99?"U":p[1]>=.99?"D":"Q"})}catch(e){out.push({t:t-300*i,r:"Q"})}}S.hist=out}
// Price to beat = Polymarket's 60-second TWAP: average of the 60 one-second Chainlink prices just before the round starts.
// The window ends 1-2s before the start (feed delay): SOL matches the window ending 2s early; BTC lands between 1s and 2s, so we average both.
const PM_OFF={btc:[1,2],sol:[2]};
function pmTwap(S,B){if(S.ptb[B]!=null)return S.ptb[B];const m={};S.pts.forEach(p=>m[p[0]]=p[1]);const r=[];
 for(const off of PM_OFF[S.k.c]||[1,2]){let sum=0;for(let t=B-60-off;t<B-off;t++){if(m[t]==null)return null;sum+=m[t]}r.push(sum/60)}
 if(Date.now()/1000>=B)S.ptb[B]=r.reduce((a,b)=>a+b,0)/r.length;return S.ptb[B]??null}
const pmAsk=async tok=>{const b=await pmJ(`https://clob.polymarket.com/book?token_id=${tok}`),a=(b.asks||[]).map(o=>+o.price);return a.length?Math.min(...a):null};
async function pmTick(){const t=Math.floor(Date.now()/1000/300)*300;
 for(const c in PM.st){const S=PM.st[c];if(S.busy)continue;S.busy=true;
  try{if(S.round!==t)await pmRound(S,t);if(S.upTok){const[u,d]=await Promise.all([pmAsk(S.upTok),pmAsk(S.dnTok)]);if(u!=null)S.upAsk=u;if(d!=null)S.dnAsk=d}}catch(e){}
  S.busy=false}}
function pmChart(S,ptb){const W=600,H=190,L=4,R=62,T=10,B=22,now=Date.now()/1000,t1=Math.max(now,S.round+20),t0=S.round,P=S.pts.filter(p=>p[0]>=t0-30);
 if(P.length<2)return`<div class="mut" style="padding:40px 0;text-align:center">Waiting for live price…</div>`;
 const ys=P.map(p=>p[1]).concat(ptb!=null?[ptb]:[]);let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*.15||y1*.0002;y0-=pad;y1+=pad;
 const tA=Math.min(t0,P[0][0]),X=t=>L+(t-tA)/(t1-tA||1)*(W-L-R),Y=v=>T+(y1-v)/(y1-y0||1)*(H-T-B),dp=S.k.dp,c="#a855f7";
 let s=`<svg viewBox="0 0 ${W} ${H}">`;for(let k=0;k<=3;k++){const v=y0+k*(y1-y0)/3;s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(148,163,184,.1)"/><text x="${W-R+6}" y="${(Y(v)+4).toFixed(1)}" fill="#8b9bb4" font-size="11">${pmUsd(v,dp)}</text>`}
 [0,.5,1].forEach((k,i)=>{const tt=tA+k*(t1-tA);s+=`<text x="${X(tt).toFixed(1)}" y="${H-5}" fill="#8b9bb4" font-size="10.5" text-anchor="${i==0?"start":i==2?"end":"middle"}">${pmSec(tt)} ${pmAP(tt)}</text>`});
 if(ptb!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(ptb).toFixed(1)}" y2="${Y(ptb).toFixed(1)}" stroke="#8b9bb4" stroke-dasharray="5 5"/><rect x="${W-R+2}" y="${(Y(ptb)-10).toFixed(1)}" width="${R-2}" height="20" rx="6" fill="#273244"/><text x="${W-R/2+1}" y="${(Y(ptb)+4).toFixed(1)}" fill="#e6edf7" font-size="11" text-anchor="middle">Target</text>`;
 if(X(t0)>L+2)s+=`<line x1="${X(t0).toFixed(1)}" x2="${X(t0).toFixed(1)}" y1="${T}" y2="${H-B}" stroke="rgba(148,163,184,.25)" stroke-dasharray="2 4"/>`;
 const d=P.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(""),l=P[P.length-1];
 s+=`<defs><linearGradient id="pmg${S.k.c}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".22"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
 <path d="${d}L${X(l[0]).toFixed(1)} ${H-B}L${X(P[0][0]).toFixed(1)} ${H-B}Z" fill="url(#pmg${S.k.c})"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px ${c})"/>
 <line x1="${X(l[0]).toFixed(1)}" x2="${W-R}" y1="${Y(l[1]).toFixed(1)}" y2="${Y(l[1]).toFixed(1)}" stroke="${c}" stroke-dasharray="4 4" opacity=".6"/>
 <circle cx="${X(l[0]).toFixed(1)}" cy="${Y(l[1]).toFixed(1)}" r="9" fill="none" stroke="${c}" stroke-width="1.5"><animate attributeName="r" values="6;11;6" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="${X(l[0]).toFixed(1)}" cy="${Y(l[1]).toFixed(1)}" r="4" fill="${c}"/>`;
 return s+"</svg>"}
function pmDraw(S){const el=document.getElementById(`pm-${S.k.c}`);if(!el)return;const k=S.k,now=Date.now()/1000,gl=`<div class="gl" style="box-shadow:0 0 22px ${k.col}33,inset 0 0 0 1px ${k.col}44"></div>`;
 if(!S.round){el.innerHTML=gl+`<b>${k.n} Up or Down 5m</b><div class="mut" style="margin-top:6px">Waiting for the next round to open on Polymarket…</div>`;return}
 const ext=PM.D&&PM.D.priceToBeat&&PM.D.priceToBeat[k.c],left=Math.max(0,S.round+300-now),ptb=pmTwap(S,S.round)??(ext&&ext[S.round]!=null?+ext[S.round]:null),cur=S.cur,df=cur!=null&&ptb!=null?cur-ptb:null,cc=df==null?"#a855f7":df>=0?GREEN:RED,ct=v=>v==null?"—":Math.round(v*100)+"¢";
 el.innerHTML=gl+`<div class="hd"><div class="ic" style="background-image:url('${esc(S.icon)}')"></div><div class="tt"><b>${k.n} Up or Down 5m</b><small>${pmClock(S.round)}–${pmClock(S.round+300)} ${pmAP(S.round+300)} PKT</small></div>
 <div class="cd"><div><b>${String(Math.floor(left/60)).padStart(2,"0")}</b><small>MINS</small></div><div><b>${String(Math.floor(left%60)).padStart(2,"0")}</b><small>SECS</small></div></div></div>
 <div class="px" style="--cc:${cc}"><div class="ptb"><small>Price To Beat</small><b>${ptb==null?"—":pmUsd(ptb,k.dp)}</b></div><div class="sep"></div><div class="cur"><small>Current Price${df==null?"":`<span class="df" style="color:${df>=0?GREEN:RED}">${df>=0?"▲":"▼"} ${pmUsd(Math.abs(df),k.dp)}</span>`}</small><b>${cur==null?"—":pmUsd(cur,k.dp)}</b></div></div>
 ${pmChart(S,ptb)}
 <div class="btns"><a class="u" href="https://polymarket.com/event/${S.slug}" target="_blank" rel="noopener">Up <b>${ct(S.upAsk)}</b></a><a class="d" href="https://polymarket.com/event/${S.slug}" target="_blank" rel="noopener">Down <b>${ct(S.dnAsk)}</b></a></div>
 <div class="sub2"><span>${ptb==null?"Price to beat shows from the next round (page opened mid-round)":(df>=0?"Up is winning right now":"Down is winning right now")}</span><a href="https://polymarket.com/event/${S.slug}" target="_blank" rel="noopener">Open on Polymarket ↗</a></div>
 <div class="hist">Last rounds: ${S.hist.map(h=>`<i class="${h.r}" title="${pmClock(h.t)} PKT">${h.r=="U"?"UP":h.r=="D"?"DOWN":"…"}</i>`).join("")||"…"}</div>`}
</script><style>.tabs{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px -28px 6px;padding:10px 28px;background:rgba(5,7,15,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(148,163,184,.12)}.tabs::-webkit-scrollbar{display:none}.tabs button{min-width:0;line-height:1.2;font:600 13.5px Inter,system-ui,sans-serif;color:#8b9bb4;background:rgba(15,23,42,.7);border:1px solid rgba(148,163,184,.18);border-radius:999px;padding:9px 15px;cursor:pointer;transition:.2s}.tabs button.on{color:#05070f;background:linear-gradient(90deg,#22d3ee,#a78bfa);border-color:transparent;box-shadow:0 0 18px rgba(34,211,238,.35)}.tabp>h3:first-child{margin-top:10px}@media(max-width:600px){.tabs{margin:14px -16px 6px;padding:10px 16px;grid-template-columns:1fr 1fr}.tabs button{padding:10px 8px;font-size:13px}}
